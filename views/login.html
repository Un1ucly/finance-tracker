<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Финансовый Трекер</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080810; --surface: #12121e; --border: rgba(255,255,255,.07);
      --text: #e2e8f0; --muted: #94a3b8; --accent: #7c3aed;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(124,58,237,.12) 0%, transparent 65%);
      pointer-events: none;
    }

    .card {
      background: #12121e;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%; max-width: 400px;
      position: relative;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon { font-size: 2rem; margin-bottom: 8px; }
    .logo h1 { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .logo p { font-size: .8125rem; color: var(--muted); margin-top: 4px; }

    /* Tabs */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(255,255,255,.04);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .tab {
      padding: 9px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: .875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s;
    }
    .tab.active {
      background: var(--accent);
      color: #fff;
    }

    /* Form */
    .form { display: flex; flex-direction: column; gap: 12px; }
    .inp-wrap { display: flex; flex-direction: column; gap: 6px; }
    .inp-lbl { font-size: .8125rem; color: var(--muted); font-weight: 500; }
    .inp {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: .9375rem;
      padding: 13px 16px;
      outline: none;
      transition: border-color .2s;
      width: 100%;
    }
    .inp:focus { border-color: var(--accent); background: rgba(124,58,237,.08); }
    .inp::placeholder { color: rgba(255,255,255,.2); }

    .btn-submit {
      width: 100%;
      padding: 14px;
      margin-top: 4px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover { background: #6d28d9; }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.2);
      border-radius: 10px;
      color: #fca5a5;
      font-size: .875rem;
      padding: 11px 14px;
      display: none;
    }
    .error-box.show { display: block; }

    .success-box {
      background: rgba(34,197,94,.1);
      border: 1px solid rgba(34,197,94,.2);
      border-radius: 10px;
      color: #86efac;
      font-size: .875rem;
      padding: 11px 14px;
      display: none;
      text-align: center;
    }
    .success-box.show { display: block; }

    .divider {
      display: flex; align-items: center; gap: 12px;
      color: rgba(255,255,255,.15); font-size: .75rem;
      margin: 4px 0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: rgba(255,255,255,.08);
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">💸</div>
    <h1>Финансовый Трекер</h1>
    <p>Войди или создай аккаунт</p>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-login" onclick="setTab('login')">Войти</button>
    <button class="tab" id="tab-register" onclick="setTab('register')">Регистрация</button>
  </div>

  <div id="error-box" class="error-box"></div>
  <div id="success-box" class="success-box"></div>

  <!-- LOGIN -->
  <div id="form-login" class="form">
    <div class="inp-wrap">
      <label class="inp-lbl">Email</label>
      <input class="inp" id="l-email" type="email" placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="inp-wrap">
      <label class="inp-lbl">Пароль</label>
      <input class="inp" id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn-submit" id="btn-login" onclick="login()">
      <span class="spinner" id="spin-login"></span>
      Войти
    </button>
  </div>

  <!-- REGISTER -->
  <div id="form-register" class="form" style="display:none">
    <div class="inp-wrap">
      <label class="inp-lbl">Email</label>
      <input class="inp" id="r-email" type="email" placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="inp-wrap">
      <label class="inp-lbl">Пароль</label>
      <input class="inp" id="r-pass" type="password" placeholder="Минимум 6 символов" autocomplete="new-password" />
    </div>
    <button class="btn-submit" id="btn-register" onclick="register()">
      <span class="spinner" id="spin-register"></span>
      Создать аккаунт
    </button>
  </div>
</div>

<script>
  // Show success message if redirected after payment
  const params = new URLSearchParams(location.search);
  if (params.get('paid')) {
    const el = document.getElementById('success-box');
    el.textContent = 'Оплата прошла успешно! Войди в аккаунт для доступа к трекеру.';
    el.classList.add('show');
  }

  let activeTab = 'login';

  function setTab(tab) {
    activeTab = tab;
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('form-login').style.display    = tab === 'login'    ? 'flex' : 'none';
    document.getElementById('form-register').style.display = tab === 'register' ? 'flex' : 'none';
    hideMessages();
  }

  function showError(msg) {
    const el = document.getElementById('error-box');
    el.textContent = msg;
    el.classList.add('show');
    document.getElementById('success-box').classList.remove('show');
  }
  function showSuccess(msg) {
    const el = document.getElementById('success-box');
    el.textContent = msg;
    el.classList.add('show');
    document.getElementById('error-box').classList.remove('show');
  }
  function hideMessages() {
    document.getElementById('error-box').classList.remove('show');
    document.getElementById('success-box').classList.remove('show');
  }

  function setLoading(id, on) {
    const btn = document.getElementById(`btn-${id}`);
    const spin = document.getElementById(`spin-${id}`);
    btn.disabled = on;
    spin.style.display = on ? 'block' : 'none';
  }

  async function login() {
    const email = document.getElementById('l-email').value.trim();
    const password = document.getElementById('l-pass').value;
    if (!email || !password) return showError('Заполни все поля');

    setLoading('login', true);
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.ok) {
        showSuccess('Входим...');
        setTimeout(() => window.location.href = '/', 500);
      } else {
        showError(data.error || 'Ошибка входа');
      }
    } catch { showError('Ошибка сети'); }
    setLoading('login', false);
  }

  async function register() {
    const email = document.getElementById('r-email').value.trim();
    const password = document.getElementById('r-pass').value;
    if (!email || !password) return showError('Заполни все поля');
    if (password.length < 6) return showError('Пароль минимум 6 символов');

    setLoading('register', true);
    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.ok) {
        showSuccess('Аккаунт создан! Переходим...');
        setTimeout(() => window.location.href = '/', 600);
      } else {
        showError(data.error || 'Ошибка регистрации');
      }
    } catch { showError('Ошибка сети'); }
    setLoading('register', false);
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (activeTab === 'login') login();
      else register();
    }
  });
</script>
</body>
</html>
